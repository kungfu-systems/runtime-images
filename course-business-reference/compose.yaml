name: kungfu-course-business-reference

services:
  database:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    restart: unless-stopped
    user: postgres
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      POSTGRES_DB: course_reference
      POSTGRES_USER: course_migrator
      POSTGRES_PASSWORD: ${COURSE_DB_MIGRATION_PASSWORD:?set COURSE_DB_MIGRATION_PASSWORD}
    volumes:
      - course-postgres:/var/lib/postgresql/data
    networks:
      - course-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_migrator -d course_reference"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: course-business-reference/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-development}
    image: ${COURSE_REFERENCE_IMAGE:-kungfu-course-business-reference:local}
    restart: unless-stopped
    read_only: true
    user: node
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      PORT: "8090"
      PUBLIC_ORIGIN: ${COURSE_PUBLIC_ORIGIN:-http://127.0.0.1:8090}
      DATABASE_URL: postgresql://course_migrator:${COURSE_DB_MIGRATION_PASSWORD}@database:5432/course_reference
      APP_DATABASE_URL: postgresql://course_app:${COURSE_DB_APP_PASSWORD:?set COURSE_DB_APP_PASSWORD}@database:5432/course_reference
      COURSE_DB_APP_PASSWORD: ${COURSE_DB_APP_PASSWORD}
      AGENT_WORK_BACKEND: ${COURSE_AGENT_BACKEND:-mock}
      AGENT_WORK_BASE_URL: ${COURSE_AGENT_BASE_URL:-}
      AGENT_WORK_MODEL: ${COURSE_AGENT_MODEL:-}
      AGENT_WORK_PROVIDER_LABEL: ${COURSE_AGENT_PROVIDER_LABEL:-}
      AGENT_WORK_DELIVERY: ${COURSE_AGENT_DELIVERY:-}
      AGENT_WORK_API_KEY_FILE: ${COURSE_AGENT_API_KEY_FILE:-}
      AGENT_WORK_TIMEOUT_MS: ${COURSE_AGENT_TIMEOUT_MS:-120000}
      SESSION_SECURE: ${COURSE_SESSION_SECURE:-false}
      SESSION_HOURS: ${COURSE_SESSION_HOURS:-24}
      OUTBOX_PROCESSING_STALE_SECONDS: ${COURSE_OUTBOX_PROCESSING_STALE_SECONDS:-30}
      STATE_DIR: /state
      COURSE_QUALIFICATION_RUN_ID: ${COURSE_QUALIFICATION_RUN_ID:-}
      COURSE_QUALIFICATION_TIMEOUT_ONCE: ${COURSE_QUALIFICATION_TIMEOUT_ONCE:-}
      COURSE_QUALIFICATION_CRASH_AFTER_ADAPTER_ONCE: ${COURSE_QUALIFICATION_CRASH_AFTER_ADAPTER_ONCE:-false}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${COURSE_PORT:-8090}:8090"
    volumes:
      - course-app-state:/state
    networks:
      - course-private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 24

networks:
  course-private:
    driver: bridge

volumes:
  course-postgres:
    name: ${COMPOSE_PROJECT_NAME:-kungfu-course-business-reference}-postgres
  course-app-state:
    name: ${COMPOSE_PROJECT_NAME:-kungfu-course-business-reference}-app-state
