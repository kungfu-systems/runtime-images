name: kungfu-course-business-reference

services:
  app:
    environment:
      AGENT_WORK_BACKEND: hosted
      COURSE_HOSTED_AGENT_BASE_URL: ${COURSE_HOSTED_AGENT_BASE_URL:?set COURSE_HOSTED_AGENT_BASE_URL}
      COURSE_HOSTED_AGENT_MODEL: ${COURSE_HOSTED_AGENT_MODEL:?set COURSE_HOSTED_AGENT_MODEL}
      COURSE_HOSTED_AGENT_PROVIDER_LABEL: ${COURSE_HOSTED_AGENT_PROVIDER_LABEL:-Hosted Agent}
      COURSE_HOSTED_AGENT_API_KEY_FILE: /run/secrets/course-agent-api-key
      COURSE_HOSTED_AGENT_TIMEOUT_MS: ${COURSE_HOSTED_AGENT_TIMEOUT_MS:-120000}
    secrets:
      - course-agent-api-key

secrets:
  course-agent-api-key:
    file: ${COURSE_HOSTED_AGENT_API_KEY_FILE:?set COURSE_HOSTED_AGENT_API_KEY_FILE}
