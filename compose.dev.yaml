name: kungfu-course-hub

# Overlay for source exploration. Use together with compose.yaml:
# docker compose -f compose.yaml -f compose.dev.yaml up --build --detach
services:
  bootstrap:
    image: kungfu-course-hub:developer
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        KUNGFU_HUB_BASE: ${KUNGFU_HUB_BASE:-ghcr.io/kungfu-systems/runtime-images/hub-starter@sha256:a0a94c04188210beaa779a094661d99bd232795fa26b17881b53ec83a50a486e}
  hub:
    image: kungfu-course-hub:developer
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        KUNGFU_HUB_BASE: ${KUNGFU_HUB_BASE:-ghcr.io/kungfu-systems/runtime-images/hub-starter@sha256:a0a94c04188210beaa779a094661d99bd232795fa26b17881b53ec83a50a486e}
