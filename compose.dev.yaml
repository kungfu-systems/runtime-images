name: kungfu-course-hub

# Overlay for source exploration. Use together with compose.yaml:
# docker compose -f compose.yaml -f compose.dev.yaml up --build --detach
services:
  bootstrap:
    image: kungfu-course-hub:developer
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        KUNGFU_HUB_BASE: ${KUNGFU_HUB_BASE:-ghcr.io/kungfu-systems/runtime-images/hub-starter@sha256:a3c6877c514970bc14bb5e5cae47f65a85119400b1b4eb2938cf92a2f794c334}
  hub:
    image: kungfu-course-hub:developer
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        KUNGFU_HUB_BASE: ${KUNGFU_HUB_BASE:-ghcr.io/kungfu-systems/runtime-images/hub-starter@sha256:a3c6877c514970bc14bb5e5cae47f65a85119400b1b4eb2938cf92a2f794c334}
