name: kungfu-course-hub

# Overlay for source exploration. Use together with compose.yaml:
# docker compose -f compose.yaml -f compose.dev.yaml up --build --detach
services:
  bootstrap:
    image: kungfu-course-hub:developer
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        KUNGFU_HUB_BASE: ${KUNGFU_HUB_BASE:-ghcr.io/kungfu-systems/runtime-images/hub-starter@sha256:5614cf1d9feaf4d085a94cf76389933d3d90b9b628ac7bffb64e3b53a176ee92}
  hub:
    image: kungfu-course-hub:developer
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        KUNGFU_HUB_BASE: ${KUNGFU_HUB_BASE:-ghcr.io/kungfu-systems/runtime-images/hub-starter@sha256:5614cf1d9feaf4d085a94cf76389933d3d90b9b628ac7bffb64e3b53a176ee92}
