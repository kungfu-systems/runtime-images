schema = 1

[project]
type = "package"
name = "runtime-images"

[version]
required = true
strategy = "semver"
next = "auto"

[[version.files]]
type = "json"
path = "package.json"
key = "version"

[lifecycle.install]
command = "npm ci --ignore-scripts --registry=https://registry.npmjs.org/"

[lifecycle.build]
command = "node scripts/verify.mjs"

[lifecycle.verify]
command = "npm run check"
