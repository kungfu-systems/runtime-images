name: Verify

on:
  pull_request:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - dev/v*/v*
      - alpha/v*/v*
      - release/v*/v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate Buildchain config
        uses: kungfu-systems/buildchain/actions/validate-config@v3
        with:
          require-version-state: "true"
          require-lifecycle-stages: "verify,publish"
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Run Buildchain verify lifecycle
        run: npm run check
      - name: Validate shell entrypoints
        run: bash -n scripts/smoke-image.sh scripts/smoke-browser.sh scripts/publish-runtime-release.sh
