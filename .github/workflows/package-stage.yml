name: Kungfu package input qualification

on:
  workflow_dispatch:
    inputs:
      kungfu-build-run-id:
        description: Exact successful kungfu-systems/kungfu Build run containing both Linux CLI packages and the product admission capsule
        required: true
      kungfu-build-head-sha:
        description: Exact GitHub head SHA recorded by the Build run
        required: true
      kungfu-source-sha:
        description: Exact qualified source SHA built by the candidate run; for pull requests this can be the synthetic merge SHA
        required: true
      package-version:
        description: Exact product version sealed by the candidate admission receipt
        required: true

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    name: Retain a non-release qualification artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Validate exact upstream Build candidate identity
        env:
          GH_TOKEN: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
          KUNGFU_BUILD_RUN_ID: ${{ inputs.kungfu-build-run-id }}
          KUNGFU_BUILD_HEAD_SHA: ${{ inputs.kungfu-build-head-sha }}
        run: |
          set -euo pipefail
          [[ "${KUNGFU_BUILD_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${KUNGFU_BUILD_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/kungfu-systems/kungfu/actions/runs/${KUNGFU_BUILD_RUN_ID}" \
            --jq '[.status, .conclusion, .head_sha, .name] | @tsv' \
            | grep -Fx $'completed\tsuccess\t'"${KUNGFU_BUILD_HEAD_SHA}"$'\tBuild'
      - name: Download exact Linux amd64 package artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
          repository: kungfu-systems/kungfu
          run-id: ${{ inputs.kungfu-build-run-id }}
          pattern: kungfu-linux-x64-*
          path: upstream/linux-amd64
          merge-multiple: true
      - name: Download exact Linux arm64 package artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
          repository: kungfu-systems/kungfu
          run-id: ${{ inputs.kungfu-build-run-id }}
          pattern: kungfu-linux-arm64-*
          path: upstream/linux-arm64
          merge-multiple: true
      - name: Download exact product admission capsule
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
          repository: kungfu-systems/kungfu
          run-id: ${{ inputs.kungfu-build-run-id }}
          pattern: kungfu-product-upgrade-publication-admission-*
          path: upstream/admission
          merge-multiple: true
      - name: Verify and normalize one exact Build candidate
        env:
          KUNGFU_BUILD_RUN_ID: ${{ inputs.kungfu-build-run-id }}
          KUNGFU_SOURCE_SHA: ${{ inputs.kungfu-source-sha }}
          PACKAGE_VERSION: ${{ inputs.package-version }}
        run: |
          set -euo pipefail
          node scripts/prepare-kungfu-build-candidate.mjs \
            --admission-root upstream/admission \
            --amd64-root upstream/linux-amd64 \
            --arm64-root upstream/linux-arm64 \
            --head-sha "${{ inputs.kungfu-build-head-sha }}" \
            --output-dir stage \
            --package-version "${PACKAGE_VERSION}" \
            --run-id "${KUNGFU_BUILD_RUN_ID}" \
            --source-sha "${KUNGFU_SOURCE_SHA}"
      - name: Upload immutable candidate metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hub-package-input-metadata-${{ github.run_id }}
          path: |
            stage/qualification.json
            stage/runtime-input-proposal.json
            stage/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Upload bounded qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hub-package-input-qualification-${{ github.run_id }}
          path: stage
          if-no-files-found: error
          retention-days: 7
