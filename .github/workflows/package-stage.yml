name: Kungfu package input qualification

on:
  workflow_dispatch:
    inputs:
      kungfu-run-id-amd64:
        description: Successful kungfu-systems/kungfu Build run containing the exact Linux x64 CLI package
        required: true
      kungfu-run-id-arm64:
        description: Successful kungfu-systems/kungfu Linux ARM64 Alpha Qualification run containing the exact Linux arm64 CLI package
        required: true
      kungfu-source-sha:
        description: Exact Kungfu source commit built by both runs
        required: true
      package-version:
        description: Exact product version recorded inside both packages
        required: true

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    name: Retain a non-release qualification artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Validate exact upstream run identity
        env:
          GH_TOKEN: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
          KUNGFU_RUN_ID_AMD64: ${{ inputs.kungfu-run-id-amd64 }}
          KUNGFU_RUN_ID_ARM64: ${{ inputs.kungfu-run-id-arm64 }}
          KUNGFU_SOURCE_SHA: ${{ inputs.kungfu-source-sha }}
        run: |
          set -euo pipefail
          [[ "${KUNGFU_RUN_ID_AMD64}" =~ ^[0-9]+$ ]]
          [[ "${KUNGFU_RUN_ID_ARM64}" =~ ^[0-9]+$ ]]
          [[ "${KUNGFU_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          validate_run() {
            local run_id="$1"
            local workflow_name="$2"
            gh api "repos/kungfu-systems/kungfu/actions/runs/${run_id}" \
              --jq '[.status, .conclusion, .head_sha, .name] | @tsv' \
              | grep -Fx $'completed\tsuccess\t'"${KUNGFU_SOURCE_SHA}"$'\t'"${workflow_name}"
          }
          validate_run "${KUNGFU_RUN_ID_AMD64}" Build
          validate_run "${KUNGFU_RUN_ID_ARM64}" 'Linux ARM64 Alpha Qualification'
      - name: Download exact Linux amd64 package artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
          repository: kungfu-systems/kungfu
          run-id: ${{ inputs.kungfu-run-id-amd64 }}
          pattern: kungfu-linux-x64-*
          path: upstream/linux-amd64
          merge-multiple: true
      - name: Download exact Linux arm64 package artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ secrets.KUNGFU_GITHUB_TOKEN }}
          repository: kungfu-systems/kungfu
          run-id: ${{ inputs.kungfu-run-id-arm64 }}
          pattern: kungfu-hub-cli-linux-arm64-*
          path: upstream/linux-arm64
          merge-multiple: true
      - name: Verify and normalize package bytes
        env:
          KUNGFU_SOURCE_SHA: ${{ inputs.kungfu-source-sha }}
          PACKAGE_VERSION: ${{ inputs.package-version }}
        run: |
          set -euo pipefail
          mkdir -p stage
          amd64_matches=$(find upstream/linux-amd64 -type f -name kungfu-episodes-cli-linux-x64.tar.gz -print)
          arm64_matches=$(find upstream/linux-arm64 -type f -name kungfu-episodes-cli-linux-arm64.tar.gz -print)
          test "$(printf '%s\n' "${amd64_matches}" | grep -c .)" -eq 1
          test "$(printf '%s\n' "${arm64_matches}" | grep -c .)" -eq 1
          cp "${amd64_matches}" stage/kungfu-episodes-cli-linux-x64.tar.gz
          cp "${arm64_matches}" stage/kungfu-episodes-cli-linux-arm64.tar.gz
          for archive in stage/*.tar.gz; do
            tar -tzf "${archive}" | grep -q '/kungfu-release-manifest.json$'
          done
          sha256sum stage/*.tar.gz >stage/SHA256SUMS
          jq -n \
            --arg schema 'kungfu.hub-starter.package-input-qualification/v1' \
            --arg sourceSha "${KUNGFU_SOURCE_SHA}" \
            --arg version "${PACKAGE_VERSION}" \
            '{schema:$schema,sourceSha:$sourceSha,packageVersion:$version,authority:"qualification-only"}' \
            >stage/qualification.json
      - name: Upload bounded qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hub-package-input-qualification-${{ github.run_id }}
          path: stage
          if-no-files-found: error
          retention-days: 7
