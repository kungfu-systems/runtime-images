name: Image candidate qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Dry-run image contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify the multi-platform source contract
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org/
          npm run check
          grep -F 'ARG TARGETARCH' Dockerfile
          grep -F 'linux/amd64,linux/arm64' scripts/publish-runtime-release.sh
      - name: Confirm dry-run boundary
        run: echo "Exact image publication is available only inside the Buildchain release transaction."
