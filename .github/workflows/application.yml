name: Compose application qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Dry-run one-command application
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: v5.1.2
      - name: Verify source and resolved application
        env:
          HUB_PORT: "18080"
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --registry=https://registry.npmjs.org/
          npm run check
          docker compose config >"${RUNNER_TEMP}/compose.resolved.yaml"
          grep -F 'published: "18080"' "${RUNNER_TEMP}/compose.resolved.yaml"
          grep -F 'host_ip: 127.0.0.1' "${RUNNER_TEMP}/compose.resolved.yaml"
          if sed -n '/^  database:/,/^  hub:/p' "${RUNNER_TEMP}/compose.resolved.yaml" | grep -q '^    ports:'; then
            echo 'PostgreSQL must not publish a host port' >&2
            exit 1
          fi
      - name: Confirm dry-run boundary
        run: echo "This workflow does not log in, push an image, publish an OCI application, or move compose-preview."
