name: Qualify Public OCI Release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: runtime-images-public-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2
        with:
          version: v5.1.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Enable the declared arm64 emulation qualification
        run: docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
      - name: Qualify exact public images and Compose persistence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/qualify-runtime-release.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: oci-compose-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/public-release/qualification
          if-no-files-found: error
